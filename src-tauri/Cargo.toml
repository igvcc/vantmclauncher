[package]
name = "vant-mc-launcher"
version = "0.1.0"
description = "Nowoczesny, szybki launcher Minecraft w stylu Vant"
authors = ["Vant Team"]
edition = "2021"

[lib]
name = "vant_mc_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v3", "v4"] }
sha1 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
dirs = "6.0"
walkdir = "2.5"
futures-util = "0.3"
sysinfo = "0.33"
md-5 = "0.11.0"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
